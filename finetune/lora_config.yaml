# MLX QLoRA config for CG-agent-harness fine-tuning on Apple Silicon.
# Target: MacBook Pro M5 Pro, 48 GB unified. Base: malekoo/Qwen3.8-27B-MLX-4bit (4-bit).
# QLoRA is automatic when --model points at a quantized MLX base.
# Memory: 4-bit base ~16-18 GB + adapter/Adam/activations ~24-28 GB peak.
# batch_size 1 + grad_checkpoint keep peak down; fits 48 GB with OS headroom
# (not guaranteed under heavy memory pressure — reduce num_layers if OOM).
#
# Train:   mlx_lm.lora --config finetune/lora_config.yaml
# Fuse:    mlx_lm.fuse --model malekoo/Qwen3.8-27B-MLX-4bit --adapter-path ./adapters --save-path ./cgagent-fused
# Serve:   mlx_lm.server --model ./cgagent-fused --port 1234
model: malekoo/Qwen3.8-27B-MLX-4bit
train: true
data: ./finetune/data
adapter_path: ./adapters
iters: 600
batch_size: 1
num_layers: 16
learning_rate: 1.0e-4
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 100
save_every: 100
lora_parameters:
  rank: 16
  alpha: 32
  dropout: 0.0
  scale: 10.0
