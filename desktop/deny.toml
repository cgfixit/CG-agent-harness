# Same dependency policy as the backend, scoped to the sole shipped desktop target.
# The only extra source is upstream Tauri, pinned to an immutable commit in Cargo.toml.
[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
allow-git = ["https://github.com/tauri-apps/tauri"]
unknown-registry = "deny"
unknown-git = "deny"
