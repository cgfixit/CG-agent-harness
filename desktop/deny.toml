# Same dependency policy as the backend, scoped to the shipped desktop architectures.
# The only extra source is upstream Tauri, pinned to an immutable commit in Cargo.toml.
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
version = 2
# Same as the backend: report unsound advisories on transitive crates too.
unsound = "all"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Push-telemetry and analytics SDKs, by exact crate name. The otel-hardening
# skill's T5 (`.claude/skills/cgagentharness-otel-hardening/check_otel.py`,
# `DENIED_TELEMETRY_CRATE_PATTERNS`) sweeps both lock graphs by name pattern,
# but it is a manual skill; this list is the CI half. cargo-deny takes exact
# names, not patterns, so each family lists the crates published on crates.io
# (checked 2026-10-03). Keep this list identical in deny.toml and
# desktop/deny.toml, and add a new family's names to both.
deny = [
    # OpenTelemetry (api, sdk, exporters, appenders, tracing bridge)
    { crate = "opentelemetry", reason = "telemetry SDK; otel-hardening T5" },
    { crate = "opentelemetry_sdk", reason = "telemetry SDK; otel-hardening T5" },
    { crate = "opentelemetry-api", reason = "telemetry SDK (pre-0.21 api crate); otel-hardening T5" },
    { crate = "opentelemetry-otlp", reason = "telemetry exporter; otel-hardening T5" },
    { crate = "opentelemetry-proto", reason = "telemetry wire format; otel-hardening T5" },
    { crate = "opentelemetry-http", reason = "telemetry transport; otel-hardening T5" },
    { crate = "opentelemetry-semantic-conventions", reason = "telemetry SDK; otel-hardening T5" },
    { crate = "opentelemetry-appender-tracing", reason = "telemetry log bridge; otel-hardening T5" },
    { crate = "opentelemetry-appender-log", reason = "telemetry log bridge; otel-hardening T5" },
    { crate = "opentelemetry-stdout", reason = "telemetry exporter; otel-hardening T5" },
    { crate = "opentelemetry-jaeger", reason = "telemetry exporter; otel-hardening T5" },
    { crate = "opentelemetry-jaeger-propagator", reason = "telemetry propagator; otel-hardening T5" },
    { crate = "opentelemetry-zipkin", reason = "telemetry exporter; otel-hardening T5" },
    { crate = "opentelemetry-prometheus", reason = "telemetry exporter; otel-hardening T5" },
    { crate = "opentelemetry-datadog", reason = "telemetry exporter; otel-hardening T5" },
    { crate = "opentelemetry-aws", reason = "telemetry exporter; otel-hardening T5" },
    { crate = "opentelemetry-contrib", reason = "telemetry SDK; otel-hardening T5" },
    { crate = "opentelemetry-resource-detectors", reason = "telemetry SDK; otel-hardening T5" },
    { crate = "tracing-opentelemetry", reason = "telemetry bridge from tracing; otel-hardening T5" },
    # Sentry (crash and error reporting)
    { crate = "sentry", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-core", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-types", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-backtrace", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-contexts", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-panic", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-debug-images", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-tracing", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-log", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-anyhow", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-tower", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-actix", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-slog", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-opentelemetry", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "sentry-rust-minidump", reason = "crash-reporting SDK; otel-hardening T5" },
    # Product analytics
    { crate = "posthog-rs", reason = "analytics SDK; otel-hardening T5" },
    { crate = "posthog", reason = "analytics SDK; otel-hardening T5" },
    { crate = "segment", reason = "analytics SDK; otel-hardening T5" },
    { crate = "segment-analytics", reason = "analytics SDK; otel-hardening T5" },
    { crate = "analytics", reason = "analytics SDK (Segment); otel-hardening T5" },
    { crate = "analytics-rust", reason = "analytics SDK (Segment); otel-hardening T5" },
    { crate = "mixpanel", reason = "analytics SDK; otel-hardening T5" },
    { crate = "mixpanel-rs", reason = "analytics SDK; otel-hardening T5" },
    { crate = "amplitude", reason = "analytics SDK; otel-hardening T5" },
    { crate = "amplitude-rs", reason = "analytics SDK; otel-hardening T5" },
    { crate = "rudderanalytics", reason = "analytics SDK (RudderStack); otel-hardening T5" },
    # APM / observability vendors
    { crate = "datadog-apm", reason = "APM SDK; otel-hardening T5" },
    { crate = "datadog-tracing", reason = "APM SDK; otel-hardening T5" },
    { crate = "datadog-statsd", reason = "APM SDK; otel-hardening T5" },
