    { crate = "libhoney-rust", reason = "telemetry SDK (Honeycomb); otel-hardening T5" },
    { crate = "tracing-honeycomb", reason = "telemetry SDK (Honeycomb); otel-hardening T5" },
    { crate = "bugsnag", reason = "crash-reporting SDK; otel-hardening T5" },
    { crate = "minitrace", reason = "telemetry SDK; otel-hardening T5" },
    { crate = "minitrace-opentelemetry", reason = "telemetry exporter; otel-hardening T5" },
    { crate = "minitrace-jaeger", reason = "telemetry exporter; otel-hardening T5" },
    { crate = "minitrace-datadog", reason = "telemetry exporter; otel-hardening T5" },
    { crate = "minitrace-macro", reason = "telemetry SDK; otel-hardening T5" },
    # Feature-flag SDKs that report evaluation events upstream
    { crate = "statsig", reason = "feature-flag SDK with event upload; otel-hardening T5" },
    { crate = "statsig-rust", reason = "feature-flag SDK with event upload; otel-hardening T5" },
    { crate = "statsig-rs", reason = "feature-flag SDK with event upload; otel-hardening T5" },
    { crate = "launchdarkly-server-sdk", reason = "feature-flag SDK with event upload; otel-hardening T5" },
    { crate = "launchdarkly", reason = "feature-flag SDK with event upload; otel-hardening T5" },
    # Bare names the T5 substring rules would also fail on
    { crate = "telemetry", reason = "telemetry SDK; otel-hardening T5" },
