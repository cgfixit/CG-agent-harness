# Daily RustSec scan of all three manifests. A new advisory against a quiet main
# otherwise surfaces only on the next push; a release run reaches the deny
# job only after a green Bundle. Same pinned action and arguments as the deny
# jobs in ci.yml and desktop.yml, advisories only. The browser sidecar's npm
# lockfile is outside cargo deny, so `npm audit` reads it here.
name: Dependencies - Daily RustSec and npm advisories

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: advisories-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  advisories:
    name: cargo deny advisories (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            manifest: Cargo.toml
            arguments: --all-features
          - name: desktop
            manifest: desktop/Cargo.toml
            arguments: --all-features --config desktop/deny.toml
          # Seatbelt fixture compiled by tests/macos_cargo.rs; root policy.
          - name: sandbox-fixture
            manifest: tests/fixtures/cargo-sandbox/Cargo.toml
            arguments: --config deny.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories
          manifest-path: ${{ matrix.manifest }}
          arguments: ${{ matrix.arguments }}

  npm-advisories:
    name: npm audit (browser sidecar)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The lockfile alone: nothing is installed and no package script runs.
      # Any advisory against a locked package exits non-zero.
      - name: npm audit of browser/package-lock.json
        working-directory: browser
        run: npm audit --package-lock-only
