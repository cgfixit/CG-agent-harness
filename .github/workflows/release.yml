name: release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 8,20 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish changed main after verification (false previews only)"
        type: boolean
        default: false

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      should_release: ${{ steps.plan.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/test-release-plan.py
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish || false }}
        run: python3 scripts/release-plan.py

  verify:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    permissions:
      contents: read
    # Job-level local workflow calls resolve at this commit, before any checkout.
    # Keep ./ syntax until actionlint supports GitHub's newer $/ syntax.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  build:
    needs: verify
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cgagentharness-linux-x86_64
            bin: target/release/cgagentharness
          - os: macos-latest
            artifact: cgagentharness-macos-arm64
            bin: target/release/cgagentharness
          # Parked 2026-09-07 — re-enable by uncommenting this include entry.
          # - os: windows-latest
          #   artifact: cgagentharness-windows-x86_64.exe
          #   bin: target/release/cgagentharness.exe
          # notes: same packaging contract as Bundle (scripts/package-release.sh
          #        via `shell: bash`). Job Object / Win32_Security is the
          #        hard-sandbox backend on this OS (not exercised by the
          #        tag build). No rust-cache on this job (zizmor
          #        cache-poisoning); keep that when restoring.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # No rust-cache here: a tag-triggered publish job that writes (or
      # even reads) a shared Actions cache is the cache-poisoning pattern
      # zizmor flags. Bundle/CI may cache; release builds from a clean tree.
      - run: cargo build --release --locked
      - name: Stage artifact with checksum (shared with Bundle)
        shell: bash
        run: scripts/package-release.sh "${{ matrix.bin }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  desktop:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/desktop.yml # zizmor: ignore[self-repository]
    with:
      artifact-name: release-cgagentharness-macos-universal-app

  publish:
    needs: [plan, build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck version and source before publication
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish || false }}
        run: python3 scripts/release-plan.py
      - name: Require the original plan
        env:
          ORIGINAL_TAG: ${{ needs.plan.outputs.tag }}
          CURRENT_TAG: ${{ steps.recheck.outputs.tag }}
          READY: ${{ steps.recheck.outputs.should_release }}
        run: test "$ORIGINAL_TAG" = "$CURRENT_TAG" && test "$READY" = true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: release-cgagentharness-*
          merge-multiple: true
      - name: Verify downloaded release package checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for checksum in *.sha256; do
            sha256sum --check --strict "$checksum"
          done
          sha256sum --check --strict SHA256SUMS
      - name: Attach binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Built from commit $SOURCE_SHA after CI and universal macOS bundle checks passed.
          The macOS app includes Apple Silicon and Intel executables. It is ad-hoc
          signed, not Developer ID signed or notarized. Automated checks do not
          establish interactive native UI acceptance on every supported Mac.
          EOF
          gh release create "$TAG" dist/* --draft --target "$SOURCE_SHA" --title "$TAG" --generate-notes --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
