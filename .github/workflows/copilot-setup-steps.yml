name: Copilot Setup Steps

# Copilot's coding agent runs the `copilot-setup-steps` job before it starts.
# The only setup it needs from this repo: point git at the tracked .githooks/
# so its commits go through the same security gate as every other driver
# (scripts/ensure-githooks.sh, docs/GITHOOKS.md). Runs on edits to this file
# to validate it, and on demand.
permissions: {}

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

concurrency:
  group: copilot-setup-steps-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Must be named exactly `copilot-setup-steps` to be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Point git at the tracked hooks
        # Local config for this checkout, global (relative) for any clone
        # Copilot makes itself. The runner is ephemeral.
        run: |
          bash scripts/ensure-githooks.sh
          git config --global core.hooksPath .githooks
