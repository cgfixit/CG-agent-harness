# Package the loopback CLI/server and universal macOS desktop application.
# Hygiene mirrors CyClaw-Net-Viewer's Bundle job: release build -> stage a
# named artifact -> sha256 -> verify after extract -> upload. Ad-hoc
# codesign on macOS only. DRY via scripts/package-release.sh (shared with
# release.yml).
name: Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  package:
    name: package (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cgagentharness-linux-x86_64
            bin: target/release/cgagentharness
          - os: macos-latest
            artifact: cgagentharness-macos-arm64
            bin: target/release/cgagentharness
          # Parked 2026-09-07 — re-enable by uncommenting this include entry.
          # - os: windows-latest
          #   artifact: cgagentharness-windows-x86_64.exe
          #   bin: target/release/cgagentharness.exe
          # notes: `shell: bash` + scripts/package-release.sh (GitHub-hosted
          #        Windows has bash). Bundle was already green on this runner;
          #        parked with the rest of Windows CI. Job Object /
          #        Win32_Security is the hard-sandbox backend on this OS
          #        (not exercised by Bundle itself).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Release build
        run: cargo build --release --locked
      - name: Stage, checksum, extract-verify
        shell: bash
        run: scripts/package-release.sh "${{ matrix.bin }}" "${{ matrix.artifact }}"
      - name: Smoke the staged binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.artifact }}"
          "$BIN" --help | grep -q serve
          if "$BIN" serve --host 0.0.0.0 --port 8790; then echo "non-loopback bind must be refused"; exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
