# Package the loopback CLI/server and universal macOS desktop application.
# Release build -> stage -> checksum -> extract-verify -> upload.
# Ad-hoc codesign on macOS; scripts/package-release.sh is shared with release.yml.
name: Bundle - CLI archives and macOS app

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  # Preserve the running build; a newer push replaces an older pending run.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # Package every main push: release-plan.py requires a green Bundle run
  # on the exact commit it releases. PR validation stays in ci.yml.
  desktop:
    uses: ./.github/workflows/desktop.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    # No timeout-minutes here: actionlint rejects it on a reusable workflow call.
    # desktop.yml jobs keep their own timeouts (longest: desktop, 90 minutes).

  package:
    name: package (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cgagentharness-linux-x86_64
            bin: target/release/cgagentharness
          - os: macos-latest
            artifact: cgagentharness-macos-arm64
            bin: target/release/cgagentharness
          # Parked 2026-09-07 — re-enable by uncommenting this include entry.
          # - os: windows-latest
          #   artifact: cgagentharness-windows-x86_64.exe
          #   bin: target/release/cgagentharness.exe
          # notes: `shell: bash` + scripts/package-release.sh (GitHub-hosted
          #        Windows has bash). Bundle was already green on this runner;
          #        parked with the Windows release leg (ci.yml still tests
          #        on Windows). Job Object /
          #        Win32_Security is the hard-sandbox backend on this OS
          #        (not exercised by Bundle itself).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ runner.os }}
          # Keep cache writes bound to trusted main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux credential-store build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Release build
        run: cargo build --release --locked
      - name: Stage, checksum, extract-verify and smoke
        shell: bash
        run: scripts/package-release.sh "${{ matrix.bin }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
