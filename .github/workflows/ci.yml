name: CGagentHarness CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  chat-browser:
    name: chat slash-command browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve Chrome binary
        run: |
          set -euo pipefail
          resolve() {
            local candidate="${1:-}"
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              echo "CHROME_BIN=${candidate}" >> "$GITHUB_ENV"
              "${candidate}" --version
              return 0
            fi
            return 1
          }
          if resolve "${CHROME_BIN:-}"; then exit 0; fi
          if resolve /usr/bin/google-chrome; then exit 0; fi
          if resolve /usr/bin/google-chrome-stable; then exit 0; fi
          if resolve /opt/google/chrome/google-chrome; then exit 0; fi
          echo "Preinstalled Chrome missing; installing google-chrome-stable" >&2
          wget -q -O /tmp/google-chrome-stable.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/google-chrome-stable.deb
          resolve /usr/bin/google-chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: node --experimental-websocket scripts/chat-browser-acceptance.mjs

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev-${{ runner.os }}
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Parked 2026-09-07 — re-enable by adding windows-latest to `os` and
        # restoring continue-on-error below.
        #   runner:   windows-latest
        #   artifact: cgagentharness-windows-latest   # release-build upload name
        #   bin:      target/release/cgagentharness.exe
        #   notes:    Job Object / Win32_Security is the least-exercised
        #             hard-sandbox backend. This test job was advisory
        #             (continue-on-error) so a red Windows leg did not
        #             block merge; ubuntu-latest + macos-latest still gate.
    # continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev-${{ runner.os }}
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The workspace jail + smoke tests drive a real git; a bare identity keeps
      # them independent of the runner's global config.
      - name: Git identity for the test fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Build (all targets)
        run: cargo build --all-targets --locked
      - name: Prepare dependency inventory for required native Cargo fixture
        if: runner.os == 'macOS'
        run: cargo fetch --locked --manifest-path tests/fixtures/cargo-sandbox/Cargo.toml
      - name: Test
        run: cargo test --all-targets --locked -- --nocapture
        env:
          # The operator's real keys must never reach a CI test process.
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
          # Operator emergency write kill-switch must not leak into cargo test.
          # Tests also isolate this; empty is not a disable value.
          CGAGENTHARNESS_AGENTIC_WRITE_DISABLE: ""
      - name: Public backend lifecycle and chat contracts (no model downloads)
        run: python3 scripts/test-desktop-backend.py
        env:
          CGAH_TEST_BINARY: target/debug/cgagentharness
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""

  invariant-guard:
    name: invariant guard (I6 source scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev-${{ runner.os }}
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --test invariant_guard --locked
        env:
          # Same contract as the test job: the operator's real keys and the
          # write kill-switch never reach a CI test process.
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
          CGAGENTHARNESS_AGENTIC_WRITE_DISABLE: ""

  smoke-real-repo-run:
    name: real-repo-run smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev-${{ runner.os }}
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Prepare native Cargo fixture (network allowed only here)
        if: runner.os == 'macOS'
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path tests/fixtures/cargo-sandbox/Cargo.toml
      - name: Required native Cargo sandbox acceptance (no skip)
        if: runner.os == 'macOS'
        run: cargo test --test macos_cargo --locked --offline -- --nocapture
        env:
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
          CGAGENTHARNESS_AGENTIC_WRITE_DISABLE: ""
      # Legacy text smoke prints a SKIP line on a host with no hard sandbox; the
      # required macOS Cargo gate above fails if sandbox execution is unavailable.
      - run: cargo test --test real_repo_loop real_repo_run_smoke_end_to_end --locked -- --nocapture
        env:
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
          CGAGENTHARNESS_AGENTIC_WRITE_DISABLE: ""

  deny:
    name: cargo deny (advisories, licenses, bans)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  msrv:
    name: MSRV check (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --all-targets --locked

  release-build:
    name: release build (${{ matrix.os }})
    needs: [fmt, clippy, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Parked 2026-09-07 — re-enable by adding windows-latest to `os` and
        # restoring continue-on-error below.
        #   runner:   windows-latest
        #   artifact: cgagentharness-windows-latest
        #   bin:      target/release/cgagentharness.exe
        #   notes:    Same as the test job: Job Object / Win32_Security is
        #             the least-exercised hard-sandbox backend. This
        #             release-build job was advisory (continue-on-error).
        #             The smoke/locate steps below already accept `.exe`.
    # continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ runner.os }}
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked
      - name: Smoke the built binary (loopback-only bind guard, exit-code contract)
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/cgagentharness
          [ -x "$BIN" ] || BIN=target/release/cgagentharness.exe
          "$BIN" --help | grep -q serve
          if "$BIN" serve --host 0.0.0.0 --port 8790; then echo "non-loopback bind must be refused"; exit 1; fi
          set +e
          "$BIN" agentic --config /nonexistent/config.yaml status; code=$?
          set -e
          [ "$code" -eq 3 ] || { echo "expected exit 3 for a missing config, got $code"; exit 1; }
      - name: Locate the release binary
        shell: bash
        run: |
          if [[ -f target/release/cgagentharness.exe ]]; then
            echo "BIN=target/release/cgagentharness.exe" >> "$GITHUB_ENV"
          else
            echo "BIN=target/release/cgagentharness" >> "$GITHUB_ENV"
          fi
      - name: Verify CLI packaging, checksums, and extracted payload
        shell: bash
        run: scripts/package-release.sh "$BIN" "cgagentharness-${RUNNER_OS}-${RUNNER_ARCH}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cgagentharness-${{ matrix.os }}
          path: ${{ env.BIN }}
          if-no-files-found: error
          retention-days: 7
