name: CGagentHarness CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  chat-browser:
    name: chat slash-command browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authentication response deadline contract
        run: node scripts/test-auth-deadlines.mjs
      - name: Resolve Chrome binary
        run: |
          set -euo pipefail
          resolve() {
            local candidate="${1:-}"
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              echo "CHROME_BIN=${candidate}" >> "$GITHUB_ENV"
              "${candidate}" --version
              return 0
            fi
            return 1
          }
          if resolve "${CHROME_BIN:-}"; then exit 0; fi
          if resolve /usr/bin/google-chrome; then exit 0; fi
          if resolve /usr/bin/google-chrome-stable; then exit 0; fi
          if resolve /opt/google/chrome/google-chrome; then exit 0; fi
          echo "Preinstalled Chrome missing; installing google-chrome-stable" >&2
          # `_current_` is a floating artifact, so there is no stable digest to
          # pin it to the way gitleaks.yml pins its release tarball. Retry so a
          # transient dl.google.com blip does not burn the job's 5-minute budget.
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-connrefused \
            -o /tmp/google-chrome-stable.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/google-chrome-stable.deb
          resolve /usr/bin/google-chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Console review reset contract
        run: node scripts/test-review-reset.mjs
      - name: Analytics dashboard contract
        run: node scripts/test-analytics.mjs
      - run: node --experimental-websocket scripts/chat-browser-acceptance.mjs

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev-${{ runner.os }}
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Parked 2026-09-07 — re-enable by adding windows-latest to `os` and
        # restoring continue-on-error below.
        #   runner:   windows-latest
        #   artifact: cgagentharness-windows-x86_64.exe  # see bundle.yml's matrix
        #   bin:      target/release/cgagentharness.exe
        #   notes:    Job Object / Win32_Security is the least-exercised
        #             hard-sandbox backend. This test job was advisory
        #             (continue-on-error) so a red Windows leg did not
        #             block merge; ubuntu-latest + macos-latest still gate.
    # continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev-${{ runner.os }}
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The workspace jail + smoke tests drive a real git; a bare identity keeps
      # them independent of the runner's global config.
      - name: Git identity for the test fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Grok ACP Phase 0 fake-runtime contract
        run: python3 scripts/test-grok-acp-probe.py
      - name: Install bubblewrap on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build (all targets)
        run: cargo build --all-targets --locked
      - name: Prepare dependency inventory for required native Cargo fixture
        if: runner.os == 'macOS'
        run: cargo fetch --locked --manifest-path tests/fixtures/cargo-sandbox/Cargo.toml
      - name: Test
        run: cargo test --all-targets --locked -- --nocapture
        env:
          # The operator's real keys must never reach a CI test process.
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
          # Operator emergency write kill-switch must not leak into cargo test.
          # Tests also isolate this; empty is not a disable value.
          CGAGENTHARNESS_AGENTIC_WRITE_DISABLE: ""
      - name: Public backend lifecycle and chat contracts (no model downloads)
        run: python3 scripts/test-desktop-backend.py
        env:
          CGAH_TEST_BINARY: target/debug/cgagentharness
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""

  linux-bwrap:
    name: Linux bubblewrap confinement (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required filesystem and network confinement (no skips)
        # Explicit docker run avoids the Docker socket that Actions mounts in
        # job containers. Only the checkout is mounted, read-only; no host
        # sysctl changes, provider credentials, or production fallback changes.
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN --cap-add NET_ADMIN \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/work,readonly" \
            --workdir /work \
            --env CI=true --env RUSTFLAGS="-D warnings" \
            --env RUSTUP_TOOLCHAIN=1.88.0 --env CARGO_TARGET_DIR=/tmp/target \
            --env CGAH_REQUIRE_LINUX_BWRAP=1 \
            --env CGAH_REQUIRE_LINUX_MCP=1 \
            rust:1.88-bookworm@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0 \
            sh -ec 'apt-get update && apt-get install -y --no-install-recommends bubblewrap python3
                    cargo test --test linux_bwrap --test mcp_client --locked -- --nocapture'

  linux-mcp-lifecycle:
    name: Linux MCP service lifecycle (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build the native lifecycle fixture
        run: cargo test --locked --test mcp_lifecycle --no-run --message-format=json > /tmp/mcp-build.jsonl
      - name: Required service ownership, resource limits and crash cleanup
        # Ephemeral hosted machine, no secrets or operator configuration. Root
        # permits namespace creation and uses the existing system service manager.
        # The product never invokes sudo or installs a privileged service.
        run: |
          test_binary="$(python3 -c 'import json; print(next(x["executable"] for x in map(json.loads, open("/tmp/mcp-build.jsonl")) if x.get("target", {}).get("name") == "mcp_lifecycle" and x.get("executable")))')"
          sudo env -i PATH=/usr/bin:/bin CGAH_REQUIRE_LINUX_LIFECYCLE=1 "$test_binary" --nocapture --test-threads=1

  invariant-guard:
    name: invariant guard (I6 source scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev-${{ runner.os }}
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --test invariant_guard --locked
        env:
          # Same contract as the test job: the operator's real keys and the
          # write kill-switch never reach a CI test process.
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
          CGAGENTHARNESS_AGENTIC_WRITE_DISABLE: ""

  smoke-real-repo-run:
    name: real-repo-run smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev-${{ runner.os }}
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Prepare native Cargo fixture (network allowed only here)
        if: runner.os == 'macOS'
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path tests/fixtures/cargo-sandbox/Cargo.toml
      - name: Required native Cargo sandbox acceptance (no skip)
        if: runner.os == 'macOS'
        run: cargo test --test macos_cargo --locked --offline -- --nocapture
        env:
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
          CGAGENTHARNESS_AGENTIC_WRITE_DISABLE: ""
      # Legacy text smoke prints a SKIP line on a host with no hard sandbox; the
      # required macOS Cargo gate above fails if sandbox execution is unavailable.
      - run: cargo test --test real_repo_loop real_repo_run_smoke_end_to_end --locked -- --nocapture
        env:
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
          CGAGENTHARNESS_AGENTIC_WRITE_DISABLE: ""

  deny:
    name: cargo deny (advisories, licenses, bans)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  msrv:
    name: MSRV check (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --all-targets --locked
