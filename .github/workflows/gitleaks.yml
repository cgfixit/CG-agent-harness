name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * 5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned CLI + sha256 (same pattern as CyClaw-Net-Viewer). The MIT
      # CLI needs no GITLEAKS_LICENSE. Replaces gitleaks-action so the
      # scanner binary is what we hashed, not an action wrapper.
      - name: Install Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan complete reachable history with redacted output
        run: >
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
          --config .gitleaks.toml --log-opts="--all" .
