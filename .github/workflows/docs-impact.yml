name: Docs impact

# The repair job lives in docs-impact-repair.yml: a pull_request_target run
# here skipped `check` and posted a second, skipped "docs impact" status on the
# PR head beside the real one, and a skipped required check reads as passing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: docs-impact-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # No job-level `if`: a skipped required check passes, so the merge queue's
  # candidate runs the same check against the queue base.
  check:
    name: docs impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify docs automation fixtures
        run: python3 scripts/test-docs-impact.py
      # A queue candidate stacks squash commits on the queue base, so the check
      # covers every queued change ahead of it. A Docs-Impact trailer counts
      # here only if the squash commit message keeps it as a trailer.
      - name: Check owning guides against the candidate's source diff
        env:
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "docs impact: no base or head SHA for $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          python3 scripts/docs-impact.py --base "$BASE_SHA" --head "$HEAD_SHA"
