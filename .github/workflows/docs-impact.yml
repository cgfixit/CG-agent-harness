name: Docs impact

# The repair job lives in docs-impact-repair.yml: a pull_request_target run
# here skipped `check` and posted a second, skipped "docs impact" status on the
# PR head beside the real one, and a skipped required check reads as passing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: docs-impact-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  check:
    name: docs impact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify docs automation fixtures
        run: python3 scripts/test-docs-impact.py
      - name: Check owning guides against the PR source diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/docs-impact.py --base "$BASE_SHA" --head "$HEAD_SHA"
