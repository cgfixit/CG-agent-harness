name: Workflows - Syntax and security lint

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", "scripts/*release-plan.py", "scripts/test-review-gate.mjs"]
  pull_request:
    paths: [".github/workflows/**", "scripts/*release-plan.py", "scripts/test-review-gate.mjs"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  # Pull requests only. Do not cancel main, tags, schedules, or release calls.
  # workflow_call keeps the caller event; if it does not, still refuse main and tags.
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_call') && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # advanced-security uploads SARIF inside this action, which would put
      # security-events: write on the job that checks out the pull request.
      # Findings still fail this job. No secrets context is passed.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: "false"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/test-release-plan.py
      - run: node scripts/test-review-gate.mjs
      # Digest is the Docker Hub multi-arch index digest for tag 1.7.12.
      - name: actionlint (pinned, from the official container image)
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
