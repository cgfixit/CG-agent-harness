name: macOS desktop

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: cg-agent-harness-macos-universal
  workflow_dispatch:

permissions: {}

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-universal
          # Only main writes the cache: PR runs restore main's entry instead of
          # each branch saving its own and evicting the others (10 GB repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            desktop -> target
      - name: Backend and desktop formatting
        run: |
          cargo fmt --all -- --check
          (cd desktop && cargo fmt -- --check)
      - name: Build and verify the complete bundle
        run: scripts/package-desktop.sh --universal
      - name: Desktop Clippy and policy tests
        run: |
          cd desktop
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Packaged backend public boundary tests
        run: python3 scripts/test-desktop-backend.py
        env:
          CGAH_TEST_BINARY: dist/CG Agent Harness.app/Contents/MacOS/cgagentharness
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
      - name: Verify archive checksum and extracted app
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS)
          ditto -x -k dist/CG-Agent-Harness-macos-universal.zip "$RUNNER_TEMP/Desktop verification"
          scripts/verify-desktop-bundle.sh "$RUNNER_TEMP/Desktop verification/CG Agent Harness.app" universal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name || 'cg-agent-harness-macos-universal' }}
          path: |
            dist/CG-Agent-Harness-macos-universal.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  desktop-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: desktop/Cargo.toml
          arguments: --all-features --config desktop/deny.toml
