# TEMPORARY evidence for this PR only; removed by a later commit on the same
# branch. ci.yml runs the full Windows suite only on main pushes and release
# calls, so this mirrors its Windows test job on pull_request.
name: TEMP - full Windows suite on this PR

on:
  pull_request:

permissions: {}

concurrency:
  group: tmp-windows-suite-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  windows-suite:
    name: TEMP full Windows suite (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve LF in shell fixtures
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.89"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev-${{ runner.os }}
          save-if: false
      - name: Git identity for the test fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Windows Clippy (all features)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build (all targets)
        run: cargo build --all-targets --locked
      - name: Prepare required native Windows fixtures
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source)
          $bash = Join-Path $gitRoot 'bin/bash.exe'
          if (!(Test-Path $bash)) { throw "Git Bash fixture executable missing: $bash" }
          "CGAH_TEST_BASH=$bash" >> $env:GITHUB_ENV
          "CGAH_WINDOWS_PYTHON=$((Get-Command python.exe).Source)" >> $env:GITHUB_ENV
          "CGAH_REQUIRE_WINDOWS_MCP=1" >> $env:GITHUB_ENV
          "CGAH_REQUIRE_WINDOWS_CREDENTIALS=1" >> $env:GITHUB_ENV
      - name: Targeted tests this PR fixes
        run: |
          cargo test --locked --lib server::mcp::config_tests -- --nocapture
          cargo test --locked --test auth_guards browser_tasks_refuse_without_accounts_even_when_enabled -- --nocapture
          cargo test --locked --test secure_portal https_bootstrap_roles_revocation_and_private_web_context -- --nocapture
          cargo test --locked --test diag_routes -- --nocapture
          cargo test --locked --test shim_and_agent_routes a_job_registered_after_its_account_was_disabled_refuses_to_run -- --nocapture
          cargo test --locked --test loop_runner loop_budget_counts_failed_inference_without_successful_exchanges -- --nocapture
          cargo test --locked --test structured_memory invalid_schema_busy_cancel_and_bounds_are_truthful -- --nocapture
        env:
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
          CGAGENTHARNESS_AGENTIC_WRITE_DISABLE: ""
      - name: Formerly flaky tests, five times each
        if: ${{ !cancelled() }}
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::repeat $i"
            cargo test --locked --test shim_and_agent_routes a_job_registered_after_its_account_was_disabled_refuses_to_run
            cargo test --locked --test loop_runner loop_budget_counts_failed_inference_without_successful_exchanges
            cargo test --locked --test structured_memory invalid_schema_busy_cancel_and_bounds_are_truthful
            echo "::endgroup::"
          done
        env:
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
          CGAGENTHARNESS_AGENTIC_WRITE_DISABLE: ""
      - name: Full suite (same command as ci.yml)
        if: ${{ !cancelled() }}
        run: cargo test --all-targets --locked --no-fail-fast -- --nocapture
        env:
          GROK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DEEPAGENT_API_KEY: ""
          CGAGENTHARNESS_AGENTIC_WRITE_DISABLE: ""
