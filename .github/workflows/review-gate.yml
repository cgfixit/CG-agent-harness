# Base-repository dispatcher. The read-only relay is only a wake-up signal:
# never download its artifacts, execute its code, or trust its verdict.
name: review gate

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] source run identity checked via API; no checkout, artifacts, caches, or untrusted verdicts
    workflows: [review gate request]
    types: [completed]
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  resolve:
    if: ${{ github.event_name == 'workflow_run' || (github.event.issue.pull_request && github.event.issue.state == 'open' && github.event.comment.user.login == 'chatgpt-codex-connector[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      wait_for_bot: ${{ steps.resolve.outputs.wait_for_bot }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: resolve
        with:
          script: |
            const { owner, repo } = context.repo;
            let pr;
            let waitForBot = false;
            if (context.eventName === "workflow_run") {
              const source = context.payload.workflow_run;
              const run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: source.id })).data;
              const workflow = (await github.rest.actions.getWorkflow({
                owner, repo, workflow_id: "review-gate-request.yml",
              })).data;
              const events = new Set(["pull_request", "pull_request_review", "pull_request_review_comment"]);
              if (run.repository.full_name !== `${owner}/${repo}` || run.workflow_id !== workflow.id ||
                  run.path.split("@")[0] !== ".github/workflows/review-gate-request.yml" || !events.has(run.event) ||
                  run.status !== "completed" || run.run_attempt !== source.run_attempt ||
                  !/^[0-9a-f]{40}$/.test(run.head_sha || "")) {
                throw new Error("unrecognized review-gate source run");
              }
              // Fork runs can have an empty pull_requests array. Match live PRs
              // against GitHub's run identity instead of using an artifact hint.
              const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
              const matches = prs.filter(p => p.base.repo.full_name === `${owner}/${repo}` &&
                p.head.sha === run.head_sha && p.head.ref === run.head_branch &&
                p.head.repo && p.head.repo.id === run.head_repository.id);
              if (matches.length === 0) {
                core.info("source head is no longer an open PR head; ignoring stale request");
                return;
              }
              if (matches.length !== 1) throw new Error("source run matched more than one PR");
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: matches[0].number })).data;
              if (pr.state !== "open" || pr.head.sha !== run.head_sha || pr.head.ref !== run.head_branch ||
                  !pr.head.repo || pr.head.repo.id !== run.head_repository.id) {
                core.info("PR changed while resolving the source run; ignoring stale request");
                return;
              }
              waitForBot = run.event === "pull_request";
            } else {
              const { issue, comment } = context.payload;
              if (!issue?.pull_request || issue.state !== "open" ||
                  comment?.user?.login !== "chatgpt-codex-connector[bot]") return;
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: issue.number })).data;
            }
            if (pr.state !== "open" || pr.base.repo.full_name !== `${owner}/${repo}`) return;
            if (!Number.isSafeInteger(pr.number) || pr.number <= 0 || !/^[0-9a-f]{40}$/.test(pr.head.sha)) {
              throw new Error("invalid PR identity");
            }
            core.setOutput("pr_number", String(pr.number));
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("wait_for_bot", String(waitForBot));

  gate:
    needs: resolve
    if: needs.resolve.outputs.pr_number != ''
    # Local reusable workflows use the same trusted revision as this dispatcher.
    uses: ./.github/workflows/review-gate-evaluate.yml
    permissions:
      checks: write
      pull-requests: read
    with:
      pr_number: ${{ fromJSON(needs.resolve.outputs.pr_number) }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      wait_for_bot: ${{ needs.resolve.outputs.wait_for_bot == 'true' }}
