# Merge gate for review follow-through. The "review gate" check fails while
# a PR still has an unresolved review thread (human or bot, Codex included)
# or while a Codex review is still running on the head, so "marked ready,
# Codex reviewed, merged before every finding was applied" cannot happen
# silently.
#
# Codex signals progress by creating and editing one summary comment on the
# PR conversation ("🔄 **Running**" then "✅ **Completed**"). Those are
# issue_comment events, whose workflow runs attach to the default branch,
# not the PR head; so the verdict is always published as a check run on the
# PR head through the Checks API under one name, "review gate", whatever
# event started the run. Make THAT check required on main (the job's own
# "evaluate" check is not the one to require).
#
# The job polls for up to POLL_MINUTES so the usual sequence (fix pushed,
# thread replied to, thread resolved a few seconds later; Codex finishing
# its pass) turns the run green without another event. Resolving a thread
# on its own fires no webhook: if the last thread is resolved without a push
# after the poll window closed, re-run the failed job from the Actions tab.
#
# Also enable "Require conversation resolution before merging" in the main
# ruleset: that native setting is the always-live version of the thread
# rule; this job adds the Codex-in-progress rule and a summary of what is
# still open.
name: review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, deleted]
  issue_comment:
    types: [created, edited]

permissions: {}

# One canceling group per PR, so a superseded evaluation stops. A comment
# from anyone but the review bot never enters that group: it would cancel a
# polling run (leaving its in_progress "review gate" check stranded) and then
# exit without publishing a verdict of its own. Such runs get a group of
# their own and are skipped by the job's `if` below. Keep the bot login here
# and in REVIEW_BOTS in sync.
concurrency:
  group: ${{ (github.event_name == 'issue_comment' && github.event.comment.user.login != 'chatgpt-codex-connector[bot]') && format('review-gate-ignored-{0}', github.run_id) || format('review-gate-{0}-{1}', github.workflow, github.event.pull_request.number || github.event.issue.number) }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: evaluate
    # issue_comment fires for plain issues and for humans too; only a PR
    # comment from the review bot is worth a run.
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      checks: write
    env:
      # Logins whose review-summary comment marks an in-progress review
      # (keep in sync with the concurrency group and job `if` above).
      REVIEW_BOTS: chatgpt-codex-connector[bot]
      POLL_MINUTES: "12"
      # Codex starts a review a few seconds after "opened" / "ready for
      # review"; wait this long before the first look on those events so the
      # gate sees the bot's Running marker instead of racing it (observed on
      # #100: gate green at :44, Codex Running posted at :43).
      GRACE_SECONDS: "45"
      CHECK_NAME: review gate
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const bots = new Set(process.env.REVIEW_BOTS.split(",").map(s => s.trim()).filter(Boolean));
            const deadline = Date.now() + Number(process.env.POLL_MINUTES) * 60_000;
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            // Resolve the PR for every trigger. On issue_comment only a comment
            // from a listed review bot is worth a re-evaluation; anything else
            // (a human "@codex review", chatter) exits without touching the check.
            let pr = context.payload.pull_request;
            if (!pr) {
              const c = context.payload.comment;
              if (!c || !c.user || !bots.has(c.user.login)) {
                core.info("issue_comment not from a review bot; nothing to evaluate");
                return;
              }
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: context.payload.issue.number })).data;
            }
            if (pr.state !== "open") { core.info(`PR #${pr.number} is ${pr.state}; nothing to evaluate`); return; }

            async function unresolvedThreads() {
              const out = [];
              let after = null;
              for (;;) {
                const q = await github.graphql(`
                  query($owner: String!, $repo: String!, $num: Int!, $after: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $num) {
                        reviewThreads(first: 100, after: $after) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            isResolved isOutdated path line
                            comments(first: 1) { nodes { author { login } url body } }
                          }
                        }
                      }
                    }
                  }`, { owner, repo, num: pr.number, after });
                const t = q.repository.pullRequest.reviewThreads;
                for (const n of t.nodes) {
                  if (n.isResolved) continue;
                  const c = n.comments.nodes[0] || {};
                  const title = (c.body || "").split("\n").find(l => l.trim()) || "";
                  out.push({ path: n.path, line: n.line, outdated: n.isOutdated, author: c.author && c.author.login, url: c.url, title: title.replace(/<[^>]+>/g, "").replace(/[*_`]/g, "").trim().slice(0, 120) });
                }
                if (!t.pageInfo.hasNextPage) break;
                after = t.pageInfo.endCursor;
              }
              return out;
            }

            // Codex edits one summary comment in place: "🔄 **Running**" while a
            // review is in flight, "✅ **Completed**" afterwards. Any listed bot
            // whose summary still says Running blocks the merge.
            async function runningReviews() {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              return comments
                .filter(c => c.user && bots.has(c.user.login) && /<!--\s*codex-pull-request-review-summary\s*-->/.test(c.body || ""))
                .filter(c => /\*\*Running\*\*/.test(c.body))
                .map(c => ({ login: c.user.login, url: c.html_url }));
            }

            // Publish the verdict on the PR head so every trigger, including
            // issue_comment (whose own run attaches to the default branch),
            // lands on the same required check.
            async function publish(status, conclusion, title, summary) {
              const body = { owner, repo, name: process.env.CHECK_NAME, head_sha: pr.head.sha, status, output: { title, summary } };
              if (conclusion) body.conclusion = conclusion;
              await github.rest.checks.create(body);
            }

            await publish("in_progress", null, "Evaluating review threads and bot reviews", `Run started for #${pr.number} @ ${pr.head.sha.slice(0, 7)}`);

            const action = context.payload.action;
            if (bots.size && context.eventName === "pull_request" && (action === "opened" || action === "ready_for_review")) {
              const grace = Number(process.env.GRACE_SECONDS) * 1000;
              core.info(`${action}: waiting ${grace / 1000}s for a bot review to announce itself before the first look`);
              await sleep(grace);
            }

            let threads, running, attempt = 0;
            for (;;) {
              attempt += 1;
              [threads, running] = await Promise.all([unresolvedThreads(), runningReviews()]);
              if (threads.length === 0 && running.length === 0) break;
              if (Date.now() >= deadline) break;
              core.info(`attempt ${attempt}: ${threads.length} unresolved thread(s), ${running.length} review(s) running; polling again in 20s`);
              await sleep(20_000);
            }

            const lines = [`## Review gate for #${pr.number} @ \`${pr.head.sha.slice(0, 7)}\``, ""];
            if (running.length) {
              lines.push(`### Review still running`, "");
              for (const r of running) lines.push(`- ${r.login}: ${r.url}`);
              lines.push("");
            }
            if (threads.length) {
              lines.push(`### Unresolved review threads (${threads.length})`, "");
              for (const t of threads) lines.push(`- \`${t.path}${t.line ? ":" + t.line : ""}\`${t.outdated ? " (outdated)" : ""} by ${t.author || "unknown"}: ${t.title} ${t.url}`);
              lines.push("", "Apply the fix and push, or reply with why not, then resolve the thread. Re-run this job if the last thread was resolved without a push.");
            }
            const ok = !running.length && !threads.length;
            if (ok) lines.push("✅ No unresolved review threads and no review in progress.");
            const summary = lines.join("\n");
            await core.summary.addRaw(summary).write();

            const title = running.length
              ? `${running.length} bot review(s) still running on this head`
              : threads.length ? `${threads.length} unresolved review thread(s)` : "All review threads resolved; no review running";
            await publish("completed", ok ? "success" : "failure", title, summary);
            if (!ok) core.setFailed(title);
