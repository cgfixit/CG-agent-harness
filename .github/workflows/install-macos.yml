# Run the macOS installer and launcher end to end on a fresh macos-latest runner:
# inventory, dry run, real install (Rust, Ollama, backend build, checksummed
# release app), idempotent rerun, app-mode browser hand-off, the standalone
# home-lock refusal, standalone mode on a separate home, and its reset.
# Path-filtered and manual only; not a merge gate. No secrets, no model pull.
# --trust-cert is not exercised: it needs an interactive keychain password.
name: macOS install

on:
  pull_request:
    paths:
      - "scripts/install-macos.sh"
      - "scripts/init.sh"
      - "scripts/start-macos.sh"
      - "scripts/start-web.sh"
      - "scripts/reset-macos.sh"
      - "scripts/test-reset-macos.py"
      - "scripts/web-allowlist-bootstrap.sh"
      - ".github/workflows/install-macos.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: install-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reset-contract:
    name: reset refusal contract (portable command doubles)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/test-reset-macos.py -v

  install:
    name: install-macos.sh and start-macos.sh (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inventory before install (missing items expected)
        run: |
          set +e
          scripts/install-macos.sh --check --app-dir "$RUNNER_TEMP/Applications"
          rc=$?
          echo "check exited $rc"
          test "$rc" = 1

      - name: Dry run prints the plan and changes nothing
        run: |
          set -euo pipefail
          scripts/install-macos.sh --dry-run --with-gh --model qwen3:0.6b --app-dir "$RUNNER_TEMP/Applications" | tee dry.log
          grep -q '^+ ollama pull qwen3:0.6b$' dry.log
          test ! -e "$RUNNER_TEMP/Applications"

      - name: Install
        timeout-minutes: 30
        run: scripts/install-macos.sh --app-dir "$RUNNER_TEMP/Applications"

      - name: Inventory after install
        run: scripts/install-macos.sh --check --app-dir "$RUNNER_TEMP/Applications"

      - name: Rerun keeps the installed app
        run: scripts/install-macos.sh --no-build --app-dir "$RUNNER_TEMP/Applications" | grep 'keeping '

      - name: init.sh replaces the admin password, keeps it in Keychain and applies the allowlist
        timeout-minutes: 10
        run: |
          set -euo pipefail
          scripts/init.sh --yes --choice 0 --app-dir "$RUNNER_TEMP/Applications"
          log=scripts/logs/install.log
          grep -q 'admin password replaced and saved in your login keychain' "$log"
          grep -q 'allowlist-bootstrap: done: 14 of' "$log"
          if grep -qiE 'setup code [0-9a-z]{4}-' "$log"; then echo 'the install log holds a setup code'; exit 1; fi
          home=$(cd "$HOME/.CGagentHarness" && pwd -P)
          security find-generic-password -a admin -s "CGagentHarness admin ($home)" >/dev/null

      - name: init.sh rerun detects the finished steps and opens the app (choice 1)
        timeout-minutes: 6
        run: |
          set -euo pipefail
          scripts/init.sh --yes --choice 1 --app-dir "$RUNNER_TEMP/Applications" | tee rerun.log
          grep -q 'already installed; nothing to do' rerun.log
          grep -q 'signed in with the admin password from your login keychain' rerun.log
          grep -q 'allowlist-bootstrap: 0 new rule' rerun.log
          grep -q '^CGagentHarness console: https://127.0.0.1:[0-9]*/$' rerun.log # DevSkim: ignore DS162092 because the app console must be a loopback origin.

      # Every step that opens a GUI app is bounded: an unanswered macOS prompt
      # must fail the step, not the 60-minute job.
      - name: App mode hands the app's own origin to start-web.sh
        timeout-minutes: 6
        run: |
          set -euo pipefail
          export CGAH_APP="$RUNNER_TEMP/Applications/CG Agent Harness.app"
          scripts/start-macos.sh | tee start.log
          # The certificate check ran against the home the backend holds.
          grep -q '^==> browser trust: ' start.log
          url=$(sed -n 's/^CGagentHarness console: //p' start.log)
          case $url in https://127.0.0.1:*/) ;; *) echo "unexpected console URL: $url"; exit 1 ;; esac # DevSkim: ignore DS162092 because the app console must be a loopback origin.
          "$CGAH_APP/Contents/MacOS/cgagentharness" tls certificate > app.pem
          code=$(curl --silent --show-error --max-time 15 --cacert app.pem -o /dev/null -w '%{http_code}' "${url}api/status")
          echo "verified TLS to the app backend; /api/status answered $code"
          test "$code" = 200

      - name: Standalone refuses while the app owns the default home
        timeout-minutes: 3
        run: |
          set +e
          scripts/start-macos.sh --no-ollama --standalone 8791
          rc=$?
          test "$rc" = 3

      - name: Standalone mode on a separate home
        id: standalone
        timeout-minutes: 5
        run: |
          set -euo pipefail
          home=$(mktemp -d "$RUNNER_TEMP/cgah-reset.XXXXXX")
          home=$(cd "$home" && pwd -P)
          printf '%s\n' "$home" > "$home/.k19-owned"
          printf 'home=%s\n' "$home" >> "$GITHUB_OUTPUT"
          CGAGENTHARNESS_HOME=$home NO_OPEN=1 scripts/start-macos.sh --no-ollama --standalone 8791 > standalone.log 2>&1 &
          server=$!
          trap 'if [ -n "$server" ]; then kill "$server" 2>/dev/null || true; wait "$server" || true; fi' EXIT
          for _ in $(seq 1 120); do grep -q '^CGagentHarness console:' standalone.log && break; sleep 0.5; done
          cat standalone.log
          # start-macos execs start-web, whose direct child holds this home's lock.
          backend=$(lsof -t -- "$home/.server.lock")
          test "$(ps -o ppid= -p "$backend" | tr -d ' ')" = "$server"
          CGAGENTHARNESS_HOME=$home target/release/cgagentharness tls certificate > standalone.pem
          code=$(curl --silent --show-error --max-time 15 --cacert standalone.pem -o /dev/null -w '%{http_code}' https://127.0.0.1:8791/api/status) # DevSkim: ignore DS162092 because the standalone console binds loopback only.
          echo "standalone /api/status answered $code"
          test "$code" = 200
          rc=0
          CGAGENTHARNESS_HOME=$home scripts/reset-macos.sh --yes > reset-active.log 2>&1 || rc=$?
          test "$rc" = 2
          grep -q 'is open or could not be checked' reset-active.log
          test -f "$home/config.yaml"
          kill "$server"
          rc=0
          wait "$server" || rc=$?
          server=''
          test "$rc" = 0 || test "$rc" = 143
          for _ in $(seq 1 120); do
            kill -0 "$backend" 2>/dev/null || break
            sleep 0.5
          done
          if kill -0 "$backend" 2>/dev/null; then echo 'owned backend did not stop'; exit 1; fi
          for name in .server.lock auth.sqlite3 memory/structured.sqlite3; do
            test -e "$home/$name" || continue
            rc=0
            holders=$(lsof -t -- "$home/$name" 2>/dev/null) || rc=$?
            test "$rc" = 1
            test -z "$holders"
          done

      - name: Reset only the stopped standalone home (native macOS)
        timeout-minutes: 3
        env:
          RESET_TEST_HOME: ${{ steps.standalone.outputs.home }}
        run: python3 scripts/test-reset-macos.py --native-home "$RESET_TEST_HOME"

      - name: Quit the app
        if: always()
        timeout-minutes: 2
        run: osascript -e 'quit app "CG Agent Harness"' || true
