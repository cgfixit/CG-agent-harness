# Blocking PR-body gate. Header regexes, the Cursor and Claude Code footer
# strips, and the core-path rule stay in lock-step with scripts/check-pr-template.sh: the
# script and this workflow enforce the same rules. The core-path rule
# requires an explicit "invariant" mention when the isolation boundary or a
# security gate moves.
#
# Dependabot's generated bodies cannot carry the template, so a Dependabot
# update is exempt, but only when GitHub's own records prove it is one: the
# author is the dependabot[bot] app account by numeric id, the head is a
# dependabot/ branch in this repository, every commit is that account's and
# carries GitHub's verified signature (an author email alone is forgeable),
# and every changed file is one dependabot.yml manages. Any other shape, or an
# API error, falls through to the full check. The script cannot mirror this:
# it reads a body, not an event.
name: PR - Template and base branch checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-template-check-${{ github.workflow }}-${{ github.ref }}
  # Pull requests only. This workflow has no push or tag trigger; keep the
  # same guard so a future trigger cannot cancel main or a release ref.
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_call') && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Stacked-base guard. PRs #36-#41 were squash-merged into their predecessor
  # feature branches instead of main, so GitHub showed them "merged" while the
  # work never reached main (recovered by #45). Fail any PR whose base is not
  # main. Make this check required on ALL branches (a ruleset
  # targeting every branch, not just main) so a merge into a feature branch is
  # blocked, not merely flagged.
  base-branch:
    name: base branch is main
    # No job-level `if:`: pull_request never fires on pushes to main, and a skipped
    # required check counts as passing, so a skip condition would be a bypass.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.eval.outputs.ok }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: eval
        with:
          script: |
            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            const ok = base === "main";
            core.setOutput("ok", ok ? "true" : "false");
            if (!ok) core.setFailed(`PR base is '${base}'; must be main.`);

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.eval.outputs.ok }}
      missing: ${{ steps.eval.outputs.missing }}
      exempt: ${{ steps.eval.outputs.exempt }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: eval
        with:
          script: |
            // Dependabot exemption; the header says why each fact is required.
            const pr = context.payload.pull_request;
            const DEPENDABOT_ID = 49699333;
            const dependabotFiles = [/^\.github\/workflows\/[^/]+\.ya?ml$/, /^(desktop\/)?Cargo\.(toml|lock)$/];
            let exempt = false;
            if (pr.user?.login === "dependabot[bot]" && pr.user?.id === DEPENDABOT_ID && pr.user?.type === "Bot" &&
                typeof pr.head?.ref === "string" && pr.head.ref.startsWith("dependabot/") &&
                pr.head?.repo?.id === pr.base?.repo?.id) {
              try {
                const params = { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number };
                const prFiles = await github.paginate(github.rest.pulls.listFiles, params);
                const commits = await github.paginate(github.rest.pulls.listCommits, params);
                exempt = prFiles.length > 0 && commits.length > 0 &&
                  prFiles.every(f => [f.filename, f.previous_filename].filter(Boolean)
                    .every(name => dependabotFiles.some(re => re.test(name)))) &&
                  commits.every(c => c.author?.id === DEPENDABOT_ID && c.commit?.verification?.verified === true);
              } catch (e) {
                core.warning(`Dependabot exemption not verified (${e.message}); running the full check`);
                exempt = false;
              }
              if (!exempt) core.info("Dependabot-authored, but not every fact held; running the full check");
            }
            if (exempt) {
              core.info("Verified Dependabot update: template check exempt");
              core.setOutput("ok", "true");
              core.setOutput("missing", "");
              core.setOutput("exempt", "true");
              return;
            }
            const submittedBody = context.payload.pull_request.body || "";
            // Lock-step with scripts/check-pr-template.sh. The tooling Claude Code
            // sessions use appends `---` then `_Generated by [Claude Code](https://
            // claude.ai/code...)_` after the body. Only when those are the last two
            // non-blank lines are they, and the blank lines before them, dropped;
            // anything else (text after them, a look-alike link, an earlier
            // footer) leaves the body unchanged.
            const trimLine = (line) => line.replace(/^[ \t\v\f]+|[ \t\v\f]+$/g, "");
            const submittedLines = submittedBody.replace(/\r/g, "").split("\n");
            const nonBlank = [];
            submittedLines.forEach((line, i) => {
              if (trimLine(line) !== "") nonBlank.push(i);
            });
            const claudeFooterAt = nonBlank.length >= 2
              && trimLine(submittedLines[nonBlank[nonBlank.length - 2]]) === "---"
              && /^_Generated by \[Claude Code\]\(https:\/\/claude\.ai\/code(\/[^) \t]*)?\)_$/.test(trimLine(submittedLines[nonBlank[nonBlank.length - 1]]))
              ? nonBlank[nonBlank.length - 2] : -1;
            const claudeBody = claudeFooterAt === -1 ? submittedBody : submittedLines.slice(0, claudeFooterAt).join("\n");
            // Lock-step with the script's second strip: Claude Code cloud
            // sessions end a body with `🤖 Generated with [Claude Code](https://
            // claude.com/claude-code)`, optionally followed by a
            // `https://claude.ai/code/session_...` line. Only that line or pair,
            // as the last non-blank text, is dropped; the stamp must precede it.
            const robotLines = claudeBody.replace(/\r/g, "").split("\n");
            const robotText = [];
            robotLines.forEach((line, i) => {
              const t = trimLine(line);
              if (t !== "") robotText.push([i, t]);
            });
            const robotFooter = /^🤖 Generated with \[Claude Code\]\(https:\/\/claude\.com\/claude-code\)$/;
            const sessionLink = /^https:\/\/claude\.ai\/code\/session_[A-Za-z0-9_-]+$/;
            const lastText = robotText[robotText.length - 1];
            const prevText = robotText[robotText.length - 2];
            const robotFooterAt = prevText && sessionLink.test(lastText[1]) && robotFooter.test(prevText[1]) ? prevText[0]
              : lastText && robotFooter.test(lastText[1]) ? lastText[0] : -1;
            const rawBody = robotFooterAt === -1 ? claudeBody : robotLines.slice(0, robotFooterAt).join("\n");
            // The first line that
            // is exactly <!-- CURSOR_AGENT_PR_BODY_END --> (surrounding space,
            // tab, vertical tab, or form feed on that line only) is the cut.
            // Every check below uses only the text above it. Text after the
            // marker cannot satisfy a heading, the stamp, the length floor, or
            // the invariant statement. A stamp below the marker fails. No
            // marker leaves rawBody unchanged. The begin comment is not cut.
            const rawLines = rawBody.replace(/\r/g, "").split("\n");
            const cursorFooterAt = rawLines.findIndex((line) =>
              /^[ \t\v\f]*<!-- CURSOR_AGENT_PR_BODY_END -->[ \t\v\f]*$/.test(line));
            const body = cursorFooterAt === -1 ? rawBody : rawLines.slice(0, cursorFooterAt).join("\n");
            const required = [
              ["Proposed changes (or Why/Benefits/Summary)", /^#{1,4}[ \t\v\f\r]*(proposed changes|benefits|why|summary|what)\b/im],
              ["Types of changes", /^#{1,4}[ \t\v\f\r]*types of changes\b/im],
              ["Benefits / why", /^#{1,4}[ \t\v\f\r]*(benefits|why)\b/im],
              ["Risks to monitor", /^#{1,4}[ \t\v\f\r]*risks?([ \t\v\f\r]*(to[ \t\v\f\r]*monitor|impact))?\b/im],
              ["Checklist", /^#{1,4}[ \t\v\f\r]*checklist\b/im],
              ["Suggested merge order of open PRs", /^##[ \t\v\f\r]+suggested merge order of open prs[ \t\v\f\r]*$/im],
              ["McLuhan tetrad", /^##[ \t\v\f\r]+mcluhan tetrad[ \t\v\f\r]*$/im],
            ];
            const missing = required.filter(([, re]) => !re.test(body)).map(([label]) => label);
            const bodyLines = body.replace(/\r/g, "").split("\n");
            const eli5At = [];
            bodyLines.forEach((line, i) => {
              if (/^## ELI5[ \t\v\f]*$/.test(line)) eli5At.push(i);
            });
            if (eli5At.length === 0) {
              missing.push("ELI5 (## ELI5 must be the last section heading)");
            } else if (bodyLines.slice(eli5At[eli5At.length - 1] + 1).some((line) => /^#{1,6}[ \t\v\f]+/.test(line))) {
              missing.push("ELI5 must be the last section heading");
            }
            let lastNonempty = "";
            for (const line of bodyLines) {
              const trimmed = line.replace(/[ \t\v\f]+$/, "");
              if (trimmed.length > 0) lastNonempty = trimmed;
            }
            // The placeholder stamp is accepted only by check-pr-template.sh
            // when the input path is .github/PULL_REQUEST_TEMPLATE.md. This
            // job reads the pull request body, so only a filled stamp passes.
            if (!/^(🤖 )?Last updated: [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} ET$/.test(lastNonempty)) {
              missing.push("Last updated timestamp (last line, YYYY-MM-DD HH:MM ET)");
            }
            if (body.trim().length < 40) missing.push("Body too short (< 40 chars)");
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.payload.pull_request.number,
            });
            const corePaths = [/^src\/shim\//, /^src\/server\/guards\.rs$/, /^src\/server\/headers\.rs$/, /^src\/agentic\/writer\.rs$/,
                          /^src\/agentic\/executor\/sandbox\.rs$/, /^src\/agentic\/workspace\.rs$/, /^assets\/config\.default\.yaml$/];
            // A renamed file reports its source as previous_filename; a core file
            // moved elsewhere still counts as touching that core path.
            const touched = files.flatMap(f => [f.filename, f.previous_filename].filter(Boolean));
            const touchesCore = touched.some(name => corePaths.some(re => re.test(name)));
            // The template itself says "invariant" in its headings and checklist, so
            // only contributor-written lines (not copied verbatim from the template)
            // can satisfy the statement requirement. Mirrors scripts/check-pr-template.sh.
            // Only the "Invariant / Governance Impact" section counts (its heading must
            // start the line, so prose that merely mentions the phrase is not a
            // heading), after folding
            // `- [x]` to `- [ ]` and collapsing whitespace on both sides. Lines copied
            // from the template are dropped; on the heading line itself the template's
            // own words are removed and at least eight characters must remain, so a
            // concise statement on that line passes while a reworded heading does not;
            // only that remainder (never the heading's own "Invariant") is judged.
            // Without that heading, any non-template line mentioning an invariant
            // counts. Mirrors scripts/check-pr-template.sh. The template is required:
            // without it boilerplate cannot be told apart, so a fetch failure fails.
            const foldBoxes = l => l.replace(/^(\s*- \[)[xX](\])/, "$1 $2").replace(/\s+/g, " ").trim();
            let templateLines;
            try {
              const t = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo,
                path: ".github/PULL_REQUEST_TEMPLATE.md", ref: context.payload.pull_request.base.sha });
              templateLines = new Set(Buffer.from(t.data.content, "base64").toString("utf8").split(/\r?\n/).map(foldBoxes));
            } catch (e) {
              core.setFailed(`PR template not readable (${e.message}); cannot evaluate the core-path rule`);
              return;
            }
            // Filled-section rule. Mirrors scripts/check-pr-template.sh. A heading
            // alone is not an answer: lines copied verbatim from the template and
            // the stamp are dropped, then the tetrad needs each of its four labels
            // followed by an answer on the same line (N/A is an answer) and ELI5
            // needs at least 40 characters of the contributor's own text.
            const sectionText = (headingRe) => {
              let buf = [], insec = false;
              for (const line of bodyLines.map(foldBoxes)) {
                if (headingRe.test(line)) { insec = true; buf = []; continue; }
                if (insec && /^#+ /.test(line)) { insec = false; continue; }
                if (insec && !templateLines.has(line) && !/^(🤖 )?last updated: /i.test(line)) buf.push(line);
              }
              return buf.join("\n");
            };
            if (/^##[ \t\v\f\r]+mcluhan tetrad[ \t\v\f\r]*$/im.test(body)) {
              // Each label starts its own line first, so one label followed directly
              // by the next is an empty answer, not an answer that begins with "R".
              // An answer may open with a backtick or a quote, so any character
              // other than a space or an asterisk starts one.
              const tetradText = sectionText(/^## mcluhan tetrad$/i).toLowerCase()
                .replace(/(enhances|obsoletes|retrieves|reverses into):/g, "\n@$1:");
              const labels = ["enhances", "obsoletes", "retrieves", "reverses into"];
              if (!labels.every((label) => new RegExp(`^@${label}:[* ]*[^* \\n]`, "m").test(tetradText))) {
                missing.push("McLuhan tetrad answers (Enhances, Obsoletes, Retrieves and Reverses into each need your own text on the label's line; N/A is allowed)");
              }
            }
            if (eli5At.length > 0 && sectionText(/^## eli5$/i).replace(/\s/g, "").length < 40) {
              missing.push("ELI5 text (write at least 40 characters of your own under ## ELI5)");
            }
            const contributed = [], other = [];
            let insec = false, seen = false;
            for (const line of body.split(/\r?\n/).map(foldBoxes)) {
              const low = line.toLowerCase();
              const heading = /^[#*_ ]*invariant \/ governance impact/.test(low);
              if (!insec) {
                if (heading) { insec = true; seen = true; }
                else { if (!templateLines.has(line) && /invariant/.test(low)) other.push(line); continue; }
              } else if (/^(---|#)/.test(line)) { insec = false; continue; }
              if (templateLines.has(line)) continue;
              if (heading) {
                const r = low.replace(/invariant \/ governance impact/g, "")
                  .replace(/\(required for any change touching core paths\):?/g, "");
                if (r.replace(/[*: ]+/g, "").length >= 8) contributed.push(r);
              } else contributed.push(line);
            }
            // The statement must name a guarantee from INVARIANTS.md (or say none),
            // not merely occupy the section. Wording beyond that is for the reviewer.
            const guarantee = /invariant|\bnone\b|\bi6\b|process isolation|guard chain|write[ -]gate|clone jail|judged|approval|secret|redact|detached|csrf|sandbox|loopback|weaker than/i;
            const statement = (seen ? contributed : other).join("\n").trim();
            if (touchesCore && !guarantee.test(statement)) {
              missing.push("Invariant / Governance Impact statement (a core path changed; say which invariant and why it holds)");
            }
            const ok = missing.length === 0;
            core.setOutput("ok", ok ? "true" : "false");
            core.setOutput("missing", missing.join(" || "));
            if (!ok) core.setFailed(`PR body is missing: ${missing.join("; ")}`);

  # Comments use a write token and fixed text. They do not read the pull
  # request body or base ref. The checks above remain the failing gates.
  comment-base:
    name: comment on base branch
    needs: base-branch
    if: always() && needs.base-branch.outputs.ok != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_OK: ${{ needs.base-branch.outputs.ok }}
        with:
          script: |
            const ok = process.env.BASE_OK === "true";
            const number = Number(context.payload.pull_request && context.payload.pull_request.number);
            if (!Number.isInteger(number)) {
              core.setFailed("pull request number missing");
              return;
            }
            const marker = "<!-- pr-base-check -->";
            const text = ok
              ? `${marker}\n✅ Base branch \`main\` is an integration branch.`
              : `${marker}\n❌ This PR does not target \`main\`. Stacking PRs on another feature branch is how #36-#41 were "merged" without reaching main.\n\nRetarget it: **Edit** (next to the title) → base: \`main\`, or \`gh pr edit ${number} --base main\`. \`main\` is the only allowed base.`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body: text });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: number, body: text });
            }

  comment-template:
    name: comment on template
    needs: check
    if: always() && needs.check.outputs.ok != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TEMPLATE_OK: ${{ needs.check.outputs.ok }}
          TEMPLATE_MISSING: ${{ needs.check.outputs.missing }}
          TEMPLATE_EXEMPT: ${{ needs.check.outputs.exempt }}
        with:
          script: |
            const ok = process.env.TEMPLATE_OK === "true";
            const exempt = process.env.TEMPLATE_EXEMPT === "true";
            const number = Number(context.payload.pull_request && context.payload.pull_request.number);
            if (!Number.isInteger(number)) {
              core.setFailed("pull request number missing");
              return;
            }
            const missing = (process.env.TEMPLATE_MISSING || "").split(" || ").map(s => s.trim()).filter(Boolean);
            const marker = "<!-- pr-template-check -->";
            const text = exempt
              ? `${marker}\n✅ PR template check exempt: verified Dependabot update (app account, branch, signed commits and managed files).`
              : ok
              ? `${marker}\n✅ PR template check passed.`
              : `${marker}\n❌ PR template check failed. Missing:\n${missing.map(m => `- ${m}`).join("\n")}\n\nFill in .github/PULL_REQUEST_TEMPLATE.md's sections (run scripts/check-pr-template.sh locally).`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body: text });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: number, body: text });
            }
