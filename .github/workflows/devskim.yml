# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "29 3 * * 3"

permissions: {}

concurrency:
  group: devskim-${{ github.workflow }}-${{ github.ref }}
  # Pull requests only. Do not cancel main, tags, schedules, or release calls.
  # workflow_call keeps the caller event; if it does not, still refuse main and tags.
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_call') && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The scanner checks out the tree with a read-only token. The DevSkim
  # job keeps that check name and is the one that publishes SARIF.
  scan:
    name: DevSkim scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1.0.16

      - name: Save DevSkim SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devskim-sarif
          path: devskim-results.sarif
          if-no-files-found: error
          retention-days: 1

  lint:
    name: DevSkim
    needs: scan
    if: always() && needs.scan.result != 'cancelled' && needs.scan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Require the scanner
        if: needs.scan.result != 'success'
        run: exit 1

      - name: Download DevSkim SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: devskim-sarif
          path: sarif

      - name: Select DevSkim SARIF
        id: sarif
        run: |
          set -euo pipefail
          file=$(find sarif -name 'devskim-results.sarif' -type f -print -quit)
          test -n "$file"
          echo "sarif-file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ steps.sarif.outputs.sarif-file }}
