version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Workflows select explicit Rust versions with `with.toolchain`.
      # Keep rust-toolchain action-SHA upgrades manual; Cargo and other
      # Actions dependencies still get weekly PRs.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: cargo
    directories:
      - /
      - /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
