# CGagentHarness runtime configuration. Seeded into $CGAGENTHARNESS_HOME/config.yaml
# on first run; the copy in the home directory is the one that is read.
#
# Runtime settings used by the standalone chat and governed coding pipeline.
# Chat starts without an assigned repository. Select agentic.repo explicitly
# before enabling coding; master, deepagent and clone-write gates ship closed.

app:
  name: "cgagentharness"
  env: "local"
  mode: "hybrid"  # "offline" | "hybrid"
  agent_job_poll_ms: 1500  # browser job polling, clamped to 1–30 seconds

models:
  # Remote chat is opt-in per model selection. A cloud turn sends only its newly
  # typed message, never local history, skills, memory, or web context. Saving a
  # provider key still requires restart.
  cloud_chat:
    enabled: true
    max_tokens: 4096
    timeout_sec: 90
    count_timeout_sec: 2 # 0.1–10; Claude count_tokens deadline, then a labelled heuristic fallback
    max_usd_per_call: null # null/absent: no gate; otherwise a finite positive USD estimate limit
    budget_on_heuristic: false # only literal true applies the cap to bytes/4 estimates (unreliable for CJK)
    grok:
      enabled: true
      model: "grok-4.6"
    claude:
      enabled: true
      model: "claude-sonnet-5"
  local_llm:
    provider: "ollama"
    base_url: "http://127.0.0.1:11434/v1"  # DevSkim: ignore DS162092 - Ollama loopback only; non-loopback refused at runtime
    model: "qwen3.8:27b-mlx"
    # Sent only for a resolved Ollama backend. none | low | medium | high | max;
    # absent/empty omits the field, an invalid value fails at boot.
    reasoning_effort: "none"
    # Server-side Ollama context must be 32768: set OLLAMA_CONTEXT_LENGTH before
    # `ollama serve` and verify context_length on /api/ps (setup-guide section 4).
    # The harness sends no num_ctx and inherits that window.
    max_tokens: 4096 # 1–25904 with Ollama reasoning=none; otherwise 1–12952 with a 2x reservation
    temperature: 0.2
    timeout_sec: 720
    # Explicit local inventory only; no inference, cloud probes or model downloads.
    inventory:
      timeout_sec: 2.0 # finite 0.1–30 seconds
      max_response_bytes: 262144 # integer 1024–1048576
      refresh_sec: 30 # 1–3600; GET /api/ollama/inventory cache. Missing keys keep this default.
    pull:
      timeout_sec: 600 # 1–3600; abortable POST /api/ollama/pull (SSE when Accept is text/event-stream)
      max_response_bytes: 1048576 # 1024–4194304 streamed NDJSON bound
    warmup:
      enabled: true # flag_is_true; missing in old homes is off. Failure is a logged degrade, never a crash.
      keep_alive_sec: 300 # 1–3600 seconds sent as keep_alive; never num_ctx
      timeout_sec: 30 # 1–120; bounded background POST /api/generate with an empty prompt
    # Optional loopback failover (LM Studio or any OpenAI-compatible server).
    fallback:
      enabled: false
      provider: "lmstudio"
      base_url: "http://127.0.0.1:1234/v1"  # DevSkim: ignore DS162092 - LM Studio loopback only; non-loopback refused at runtime
      model: "qwen3.8-27b-instruct"
      probe_timeout_sec: 1.5
    # ── MLX QLoRA fine-tuned model (opt-in) ─────────────────────────────────
    # To use a fused MLX model served by `mlx_lm.server --port 1234`, set it as
    # PRIMARY (not fallback — the fallback above only wins if this primary is
    # not installed). Example:
    #   provider: "lmstudio"
    #   base_url: "http://127.0.0.1:1234/v1"   # DevSkim: ignore DS162092 - loopback only
    #   model: "cgagent-fused"                 # exact id mlx_lm.server reports
    # Repoint `agentic.deepagent_github` too (provider: "openai_compatible",
    # same base_url) so the coding planner uses the fine-tune as well.
    # See docs/FINETUNE.md and finetune/ for the full workflow.

# Local chat prompt compaction. Trigger is estimated next-prompt size, not
# lifetime TokenTally.total. System prompt and session.goal are never compacted.
chat:
  compact_prompt_tokens: 24000 # floor=effective reply reservation + 4096, capped at 30000
  compact_keep_messages: 8 # 2–40 most recent messages kept verbatim

compaction:
  summary_max_tokens: 768 # clamped to 128–2048; existing homes without this key also use 768

# Chat text attachments (/api/chat/attachments). Size, count and quota limits
# are fixed in src/server/attachments.rs; this bounds how many upload bodies
# (up to ~45 MiB each) may be buffered at once. Range 1–8.
attachments:
  max_concurrent_uploads: 2
  # Server-side deadline for receiving one upload body (seconds, 5–600); a
  # stalled client releases its permit when it expires.
  body_timeout_sec: 120

# Home-jail .md/.txt notes for local chat and prompt preview only.
# Not structured memory. Cloud, /loop, and /agent never receive these bytes.
notes_corpus:
  max_files_per_owner: 64 # 1–256
  max_file_bytes: 524288 # 1024–1048576
  max_home_bytes: 8388608 # 1048576–33554432
  max_files_per_request: 8 # 1–16
  max_concurrent_ingests: 2 # 1–8

# These API limits and the listed web limits support admin Reload limits/SIGHUP.
# See docs/CONFIG_RELOAD.md; secrets, authority and other settings require restart.
api:
  rate_limit:
    max_requests: 60       # 1–100000; per-IP request ceiling within the window
    window_seconds: 60     # finite 0.001–86400; sliding-window seconds
  # /loop turns get their own, tighter budget.
  harness_loop_rate_limit:
    max_requests: 8
    window_seconds: 300
    max_tokens: 2048 # same backend-dependent ceiling as local chat; legacy 0 selects 2048

# Bounded public content reads; fresh harness.json enables web with an empty URL allowlist.
# Missing values in existing homes use these defaults; invalid values fail boot.
web:
  chat_tool_calls: 3 # 1–5 read-only calls per chat turn; no tools in /loop
  response_bytes: 262144 # 1024–1048576; compressed bodies refused
  request_seconds: 8 # 1–30, includes queue, DNS, headers and body
  concurrency: 2 # 1–4 total fetches; restart-only (shared permits)
  pages: 20 # 1–40 per run
  run_bytes: 2097152 # 1024–8388608 per run
  run_seconds: 60 # 1–180
  per_site_pages: 10 # 1–20
  pace_ms: 250 # 100–5000 between requests to an origin
  cache_pages: 128 # 1–256; derived cache, oldest documents evicted
  cache_bytes: 16777216 # 1048576–33554432 serialized cache bytes
  subqueries: 3 # 1–5 total model-selected subqueries
  rounds: 2 # 1–2 planning/retrieval rounds; one bounded crawl per run
  evidence_tokens: 6000 # 256–6000, estimated when no tokenizer is available
  model_tokens: 1024 # 256–2048 maximum synthesis completion
  total_tokens: 28000 # 2048–32000; sized for a verified 32768-token server window with ~4k reserved for completion
  # If /api/ps context_length is smaller or unverified, keep 16000 here and evidence_tokens 3000.
  research_seconds: 300 # 10–1800 overall research deadline
  stale_seconds: 604800 # 60–31536000; fetch age, not publication-date verification

# Completion webhooks are explicit operator configuration and restart-only.
notifications:
  enabled: false
  webhook_url: ""
  private_url_allowlist: [] # exact URLs only; loopback/RFC1918/ULA require this grant
  queue_capacity: 128 # 1–512 pending events, best effort (not durable)
  batch_size: 16 # 1–32 events per POST
  batch_interval_sec: 30 # 1–3600; bounds notification frequency
  max_attempts: 3 # 1–3, stable batch ID across retries
  retry_delay_sec: 2 # 1–60
  timeout_sec: 5 # 1–30, includes DNS and request

# External MCP tools. Off until an operator declares servers. Never auto-discover.
# SSE loopback is an explicit toggle and ships off. MCP tools never appear on /loop.
# stdio command[0] must be an absolute path. Calls require confirm: true.
# Each stdio entry requires capabilities version 1; missing/invalid grants fail
# closed. See docs/MCP_CLIENT.md for read_roots, write_roots, network, containment
# and strict process/memory limits. These authority settings require restart.
mcp:
  enabled: false
  sse_allow_loopback: false
  timeout_sec: 15 # 1–60
  max_result_bytes: 65536 # 1024–262144
  servers: []

security:
  # Compatibility setting. Harness keys are optional metadata and never grant
  # account permissions. False is deprecated and does not disable account login.
  api_key_optional: true

tls:
  enabled: true # newly seeded homes use HTTPS; existing configs are not rewritten
  auto_generate: true # unique local cert/key in a private atomic PEM bundle
  certificate_days: 90 # 1–365; renew explicitly before expiry
  cert_file: "" # optional operator PEM chain, relative to home or absolute
  key_file: "" # paired private PEM key; never overwritten by automatic generation

auth:
  # New homes require login on operational routes. Existing configs are retained.
  # Fresh admin/admin can only inspect its identity, change its password or log
  # out. Password replacement requires 12 characters and revokes old sessions.
  enabled: true
  # scrypt uses about 128 MiB per derivation; bound a burst to 1–4 operations.
  max_concurrent_operations: 2
  session:
    idle_timeout_sec: 43200
    absolute_timeout_sec: 604800

logging:
  level: "INFO"
  # One structured tracing line per HTTP request (method, path, status,
  # latency, client). Never headers, bodies or query strings.
  request_log: true
  audit_file: "logs/audit.jsonl"
  # Home-relative JSONL. Absolute paths and `..` fall back to this default.
  spend_file: "logs/spend.jsonl"
  # Each JSONL sink retains a current file and one .1 generation.
  max_file_bytes: 8388608 # clamped to 64 KiB–64 MiB; oversized events are dropped
  # The server and the agentic child append to one audit file. A busy lease
  # is retried every audit_lease_retry_ms until audit_lease_wait_ms has
  # elapsed since the record was submitted, then the record is refused with a
  # warning. 0 disables the wait (refuse on the first busy lease).
  audit_lease_wait_ms: 50 # clamped to 0–5000
  audit_lease_retry_ms: 2 # clamped to 1–1000
  audit_fields:
    include_query_hash: true

policy:
  prompt_filter:
    enabled: true
    # Regex patterns compiled case-insensitively. Shared input filtering policy.
    banned_patterns:
      - 'ignore\s+(previous|all|prior)\s+instructions'
      - 'ignore\s+all\s+previous'
      - 'ignore\s+safety'
      - 'disregard\s+(previous|all|prior)'
      - 'forget\s+(previous|all|prior)\s+instructions'
      - 'override\s+instructions'
      - 'bypass\s+(safety|filters|restrictions|rules)'
      - 'do\s+anything\s+now'
      - 'ignore\s+(all|any)\s+\S+\s+(instructions|directives|guidance)'
      - 'ignore\s+earlier\s+(instructions|directives|guidance)'
      - 'you\s+are\s+now'
      - 'you\s+are\s+no\s+longer'
      - 'pretend\s+(you\s+are|to\s+be)'
      - 'act\s+as\s+(?:\S+\s+){0,4}(if\b|your\s+developer|uncensored|dan\b|without\b|no\s+(?:restrictions?|filters?|limits?|rules?)|jailbreak|penetration\s+tester|unrestricted|\bai\b)'
      - 'roleplay\s+as|assume\s+the\s+role'
      - 'from\s+now\s+on\s+you\s+(will\s+)?(behave|act)\s+as'
      - 'new\s+instructions\s*:'
      - 'system\s+prompt\s*:'
      - 'admin\s*:|developer\s+override'
      - 'sudo\s+mode|root\s+access'
      - 'maintenance\s+mode.*safety\s+filters\s+disabled'
      - 'critical\s+update\s+to\s+your\s+instructions'
      - 'message\s+from\s+your\s+(creators?|developers?|makers?)'
      - 'remember\s+(for\s+future|this\s+for\s+later|as\s+permanent|in\s+memory)'
      - 'save\s+this\s+(for\s+later|in\s+your\s+memory|permanently)'
      - 'update\s+your\s+(memory|knowledge\s+base|soul)'
      - 'store\s+this\s+as\s+(a\s+rule|permanent|core\s+instruction)'
      - 'core\s+instruction,\s*never\s+forget'
      - 'add\s+to\s+your\s+(knowledge|memory|personality)\s+base'
      - 'store\s+this\s+as\s+a\s+core\s+instruction'
      - 'persist\s+.{0,30}across\s+sessions\s*:\s*\S'
      - 'critical\s+update|important\s+update'
      - 'from\s+(it\s+department|system\s+administrator)'
      - 'urgent\s+(action|request|override|update)|action\s+required'
      - 'from\s+the\s+(it\s+department|system\s+administrator)\s*:\s*\S'
      - 'execute\s+command|run\s+this\s+code'
      - 'call\s+function|use\s+tool\s+to|invoke\s+tool'
      - 'jailbreak|dan\s+mode|developer\s+mode'
      - 'decode\s+and\s+execute|base64.{0,40}execute|execute.{0,40}base64'
      - 'reveal\s+(your\s+)?(instructions|system\s+prompt)'
    max_input_chars: 4000
  privacy:
    redact_emails: true
    redact_ips: true
    redact_secrets_like:
      - 'Bearer\s+[A-Za-z0-9\-_.]+'
      - '[Aa][Pp][Ii][_-]?[Kk][Ee][Yy]["''\s]*[:=]["''\s]*[\w\-.]{4,}'
      - "AKIA[0-9A-Z]{16}"
      - "xox[baprs]-[0-9a-zA-Z-]+"
      - "ghp_[a-zA-Z0-9]{36}"
      - "sk-[a-zA-Z0-9]{20,}"
      - "sk-ant-[a-zA-Z0-9_-]{20,}"
      - "xai-[a-zA-Z0-9]{20,}"

personality:
  soul_max_chars: 8000
  prompt_skill_max_chars: 6000
  prompt_skills_total_chars: 16000

agentic:
  enabled: false                 # master switch; CLI no-ops (exit 0) while false
  repo: "" # set owner/name explicitly before enabling coding
  mode: "write"                  # "read" | "write"
  writes_enabled: true           # writes need mode=write AND this AND reason AND confirm
  gh_min_version: "2.40.0"
  gh_timeout_sec: 30
  gh_retries: 2
  registry_path: "data/agentic/skills_registry.json"  # must stay under the home data/ tree
  allowed_read_ops:
    - pr_view
    - pr_list
    - pr_diff
    - issue_view
    - issue_list
    - repo_view
  deepagent_github:
    enabled: false
    provider: "ollama"
    base_url: "http://127.0.0.1:11434/v1"  # DevSkim: ignore DS162092 - Ollama loopback only; non-loopback refused at runtime
    model: "qwen3.8:27b-mlx"
    planner_timeout_sec: 720
    # ~24k-char planner prompt + planner_max_tokens 3072 now fits comfortably in 32k (previously tight against a 16k window).
    planner_max_tokens: 3072
    allow_git_write_tools: false
    protected_write_paths:
      - "tests/"
      - "conftest.py"
      - ".github/"
      - ".git/"
      - "pyproject.toml"
      - "setup.cfg"
      - "pytest.ini"
      - ".ruff.toml"
      - "ruff.toml"
      - "tox.ini"
      - "noxfile.py"
      - ".claude/"
      - ".codex/"
      - "config.yaml"
      - "AGENTS.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rustfmt.toml"
    # Default-on READ basename deny-list (model === READ === and operator
    # --read-file). Enforced after clone-jail canonicalization against the
    # final path segment, with name-equivalence folding so aliases/case still
    # match. `*` is the only wildcard. This is not a secret scanner: secrets
    # can use arbitrary names. The clone jail stops path escape; it is not a
    # secrets control. Override the list in the home config.yaml if needed.
    denied_read_basenames:
      - ".env"
      - ".env.*"
      - "*.pem"
      - "id_rsa"
      - "id_rsa*"
      - "id_ed25519*"
      - "id_ecdsa*"
      - "credentials*"
      - "credentials.json"
      - ".npmrc"
      - ".netrc"
      - "*.p12"
    max_write_budget_bytes: 100000
    # Local coding planner only; missing/quoted/non-boolean enabled stays off.
    retrieval:
      enabled: false
      max_files: 256 # Candidate paths examined per step; 1–1024.
      max_index_bytes: 2000000 # UTF-8 content indexed per step; 1–16000000.
      top_k: 3 # At most 1–8 additional files, after operator/model selections.
      excerpt_lines: 40 # Inclusive line window; 1–200, also capped by existing read budgets.
      token_budget: 2048 # 256–8192 conservative UTF-8 byte reservations, including excerpt headers.
    scan_code_shape: true
    max_handoff_chars: 200000
    workspace_root: "data/agentic/workspaces"
    allow_cloud_providers: true
    providers:
      grok:
        enabled: true
        model: "grok-4.5"
      claude:
        enabled: true
        model: "claude-sonnet-5"
  harness_optimizer:
    enabled: false
    max_iterations: 3
    output_dir: "data/agentic/harness_optimizer/runs"

unslop:
  enabled: false
  metrics_path: "logs/unslop.jsonl"

# Account-private structured facts, governed proposals, and optional episodes.
# Distinct from harness.json.memory_enabled, which only includes pinned
# /memory notes in the chat prompt. Missing, quoted, or non-boolean values
# evaluate false. File mode 0600 is OS access control, not encryption.
# episode_capture is a second gate: it never opens the store by itself, and
# does not write when structured_memory.enabled is off.
# explicit_recall is a third independent gate: selected facts enter /prompt
# only when this is the literal boolean true AND the store is open. It does
# not enable FTS, automatic recall, consolidation, or episode injection.
# retrieval is a fourth independent gate: FTS5 search and per-request
# force-include. Search returns candidates only; prompt injection still
# requires an explicit pick (selected_facts, /memory retrieve, or the
# retrieve request flag) plus assembly-time owner/active/revision recheck.
# auto_retrieval is a fifth independent gate (Advisor-sensitive silent path):
# when true AND retrieval is true, chat may FTS the user message and inject
# rechecked top-k without a per-request flag. Ships true. /memory on never
# opens any of these gates.
# consolidation is a sixth independent gate: manual selected-episode
# consolidation into pending proposals only. It does not apply facts, does
# not inject episodes, and does not enable auto_consolidation.
# auto_consolidation is a seventh independent gate: a bounded idle worker
# that reuses the manual consolidator. Requires consolidation (AND). Ships
# true. Quoted "true" is OFF. Feature-off starts no worker. Output is
# pending proposals only; chat wins the generation gate.
memory:
  # Initial pinned-note inclusion; existing harness.json choices win.
  enabled: true

structured_memory:
  enabled: true
  episode_capture: true
  explicit_recall: true
  retrieval: true
  auto_retrieval: true
  consolidation: true
  auto_consolidation: true
  # Config defaults and administrator overrides: bounded completed inputs -> pending proposals, never facts.
  # Both require enabled + episode_capture. They do not open consolidation/recall.
  auto_suggest_chat: true
  auto_suggest_coding: true
  suggestion_mode: "both" # summaries | insights | both; invalid values disable suggestions
  suggestion_max_input_chars: 8000 # total across input/output, split equally
  suggestion_max_queue: 8 # queued inputs; one additional generation may be running
  suggestion_queue_ttl_secs: 300 # volatile inputs expire; restart drops them
  suggestion_idle_ms: 2000
  max_facts_per_owner: 64
  max_fact_chars: 1000
  max_category_chars: 64
  max_proposals_per_owner: 32
  max_reason_chars: 1000
  max_episodes_per_owner: 128
  max_episode_summary_chars: 500
  max_episode_bytes_per_owner: 65536
  episode_ttl_secs: 2592000
  max_export_bytes: 262144
  max_selected_facts: 8
  max_search_query_chars: 64
  max_search_results: 32
  max_retrieval_results: 4
  max_retrieval_tokens: 8
  max_retrieval_token_chars: 32
  max_search_time_ms: 250
  pinned_prompt_chars: 1500
  selected_fact_prompt_chars: 1500
  max_consolidation_episodes: 8
  max_consolidation_candidates: 8
  # Drop lower-confidence candidates; omitted model confidence remains accepted.
  min_consolidation_confidence: 0.40
  auto_consolidation_idle_ms: 2000
