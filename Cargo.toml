[package]
name = "cgagentharness"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "CGagentHarness: a loopback-only agentic coding harness console (Rust port of CyClaw's harness/ + agentic/ real-repo pipeline)"
license = "MIT"
repository = "https://github.com/cgfixit/CG-agent-harness"
default-run = "cgagentharness"

[lib]
name = "cgagentharness"
path = "src/lib.rs"

[[bin]]
name = "cgagentharness"
path = "src/main.rs"

[features]
# Test-only fixtures and fault hooks (netconnect fixture/probe sources, the
# structured-memory proposal-insert failure trigger). Off by default so release
# builds never compile them; the self dev-dependency below turns it on for every
# test target, so plain `cargo test --all-targets` keeps full coverage.
test-support = []

[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14.10"
x509-parser = "0.18"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml_ng = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "blocking"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
unicode-normalization = "0.1"
sha2 = "0.11"
base64 = "0.22"
subtle = "2"
scrypt = { version = "0.11", default-features = false }
rand = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
url = "2"
walkdir = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42.0"
dunce = "1"
cap-std = "4"
scraper = { version = "0.27", default-features = false }
# Use the same parser as scraper, with incremental cancellation and state bounds.
html5ever = "0.39"
robotstxt = "0.3"
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
keyring-core = "=1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Self dev-dependency: enables `test-support` for integration tests only. Resolver 2
# keeps dev-dependency features out of `cargo build --release`. The exact version
# pin satisfies deny.toml `wildcards = "deny"`; bump it with `package.version`.
cgagentharness = { path = ".", version = "=0.1.0", features = ["test-support"] }
proptest = "1.6"
# I6 is enforced by parsing `use` trees in tests/invariant_guard.rs, not by
# scanning for substrings: `use crate::{agentic as pipeline}` defeats a substring
# scan. syn is already in the lock graph via the derive macros, so this adds no
# new crates to the build.
syn = { version = "3", default-features = false, features = ["full", "parsing", "visit"] }

# scrypt at n=2^17 is unusably slow unoptimized; optimize dependencies even in dev/test.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
