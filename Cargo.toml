[package]
name = "cgagentharness"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "CGagentHarness: a loopback-only agentic coding harness console (Rust port of CyClaw's harness/ + agentic/ real-repo pipeline)"
license = "MIT"
repository = "https://github.com/cgfixit/CG-agent-harness"
default-run = "cgagentharness"

[lib]
name = "cgagentharness"
path = "src/lib.rs"

[[bin]]
name = "cgagentharness"
path = "src/main.rs"

[features]
# Test-only fixtures and fault hooks (netconnect fixture/probe sources, the
# structured-memory proposal-insert failure trigger). Off by default so release
# builds never compile them; the self dev-dependency below turns it on for every
# test target, so plain `cargo test --all-targets` keeps full coverage.
test-support = []

[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14.10"
x509-parser = "0.18"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml_ng = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
subtle = "2"
scrypt = { version = "0.11", default-features = false }
rand = "0.8"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
url = "2"
walkdir = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42.0"
dunce = "1"
cap-std = "4"
scraper = { version = "0.27", default-features =false }
