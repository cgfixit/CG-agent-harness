# shellcheck shell=bash disable=SC2034  # sourced by _security.sh, which reads these
# CGagentHarness values for .githooks/_security.sh. Sourced after the generic
# defaults, so append with += rather than replacing a list.

# Operator-home spill (the same list .gitignore carries): what a home placed
# inside the checkout, or a `git add -f`, would publish.
SEC_BLOCKED_GLOBS+=(
  'harness.json' 'soul.md' 'soul-pending-apply.json'
  'auth.json' 'auth.initialized' 'cli-session.json'
  '.CGagentHarness/*' '*/.CGagentHarness/*'
  'sessions/*' '*/sessions/*'
  'tls/*' 'soul-history/*'
  'attachments/*' 'notes_corpus/*' 'exports/*' 'memory/*' 'logs/*'
  'data/agentic/*'
)

# Must stay ignored (checked with git check-ignore on every commit).
SEC_IGNORE_PROBES+=( 'auth.sqlite3' 'harness.json' 'cli-session.json' '.CGagentHarness/probe' 'data/agentic/probe' )

SEC_PROTECTED_GLOBS+=( '.gitleaks.toml' 'deny.toml' )

# CLAUDE.md "Core paths".
SEC_NOTICE_GLOBS+=(
  'src/shim/*'
  'src/server/guards.rs' 'src/server/headers.rs'
  'src/agentic/writer.rs' 'src/agentic/workspace.rs'
  'src/agentic/executor/sandbox.rs'
  'assets/config.default.yaml'
)
SEC_NOTICE_TEXT='Read INVARIANTS.md first; the PR body needs an invariant statement (scripts/check-pr-template.sh).'

# Synthetic fixtures already in the tree (redaction tests, .gitleaks.toml).
SEC_ALLOW_REGEX='AKIAABCDEFGHIJKLMNOP|ghp_(0123456789abcdef|abcdefghij)|sk-ant-(api03-SUPERSECRET|abcdefghij)'

# First line of the CI merge gate; seconds, no compile.
sec_repo_pre_commit() {
  printf '%s\n' "$SEC_FILES" | grep -E '\.rs$' >/dev/null || return 0
  command -v cargo >/dev/null 2>&1 || return 0
  if ! cargo fmt --all -- --check >/dev/null 2>&1; then
    sec__say "security gate: cargo fmt --all -- --check failed (CI merge gate). Run: cargo fmt --all"
    return 1
  fi
}
